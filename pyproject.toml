[project]
name = "eris"
version = "0.3.0"
description = "Bot de Discord da GAIA - conexão, segurança, mensagens, moderação, exportação e voz como transporte; processo próprio, sem interface gráfica, consumido pela GAIA via HTTP (webhook reverso pra conteúdo)."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7",
    "discord-ext-voice-recv-dave @ git+https://github.com/Gabrieljsa21/discord-ext-voice-recv-dave.git@78fcb434a3484f2abf54cf89e80e86b651e5c28d",
    "davey>=0.1.4",
    "PyNaCl",
    "numpy",
    "requests>=2.31",
    "python-dotenv",
    "yt-dlp",
    "pandora",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

# Por que cada dependência fora do comum (pandora por caminho local, yt-dlp,
# fork do discord-ext-voice-recv para o DAVE): docs/ARQUITETURA.md, seção
# "Dependências fora do comum".
[tool.uv.sources]
pandora = { path = "../Project-PANDORA", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

# Testes em testes/testar_*.py, funções testar_* (convenção do projeto em
# português). Rodar da raiz: .venv\Scripts\python.exe -m pytest
[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["testar_*.py"]
python_functions = ["testar_*"]
addopts = "-p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eris*"]

[project.scripts]
eris = "eris.main:main"
